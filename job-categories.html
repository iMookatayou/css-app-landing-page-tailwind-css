<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="max-w-[1420px] mx-auto py-16 px-6">
      <div class="w-[312px] h-[100px] mx-auto text-center mb-10">
        <h2
          class="font-['Poppins'] font-bold text-[40px] leading-[50px] text-[#183B56] text-center"
        >
          Browse by <br />
          <span class="relative inline-block">
            <span class="relative z-10 text-[#183B56]">Job</span>
            <span
              class="absolute bottom-1 -left-[1px] w-[calc(100%+2px)] h-[22px] bg-[#f47b3b]/50 z-[-1]"
            ></span>
          </span>
          Categories
        </h2>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div
          class="border border-gray-200 rounded-lg p-6 flex flex-col justify-between h-[268px]"
        >
          <div
            class="w-[80px] h-[80px] bg-orange-50 rounded-full flex items-center justify-center"
          >
            <img
              src="public/icon/iconspace_Marketing.svg"
              alt="Digital Marketing"
              class="w-10 h-10"
            />
          </div>
          <div>
            <h3 class="font-bold text-[#1a1a2c]">Digital Marketing</h3>
            <div class="flex items-center justify-between mt-1">
              <p class="text-gray-400 text-sm">143 Jobs Opened</p>
              <i class="fa-solid fa-arrow-right text-base text-gray-500"></i>
            </div>
          </div>
        </div>

        <div
          class="border border-gray-200 rounded-lg p-6 flex flex-col justify-between h-[268px]"
        >
          <div
            class="w-[80px] h-[80px] bg-orange-50 rounded-full flex items-center justify-center"
          >
            <img
              src="public/icon/iconspace_Pen.svg"
              alt="Art & Design"
              class="w-10 h-10"
            />
          </div>
          <div>
            <h3 class="font-bold text-[#1a1a2c]">Art & Design</h3>
            <div class="flex items-center justify-between mt-1">
              <p class="text-gray-400 text-sm">110 Jobs Opened</p>
              <i class="fa-solid fa-arrow-right text-base text-gray-500"></i>
            </div>
          </div>
        </div>

        <div
          class="border border-gray-200 rounded-lg p-6 flex flex-col justify-between h-[268px] bg-gray-50"
        >
          <div
            class="w-[80px] h-[80px] bg-[#f47b3b] rounded-full flex items-center justify-center"
          >
            <img
              src="public/icon/coin.svg"
              alt="Accounting"
              class="w-10 h-10 brightness-0 invert"
            />
          </div>
          <div>
            <h3 class="font-bold text-[#1a1a2c]">Accounting</h3>
            <div class="flex items-center justify-between mt-1">
              <p class="text-gray-400 text-sm">158 Jobs Opened</p>
              <i class="fa-solid fa-arrow-right text-base text-gray-500"></i>
            </div>
          </div>
        </div>

        <div
          class="border border-gray-200 rounded-lg p-6 flex flex-col justify-between h-[268px]"
        >
          <div
            class="w-[80px] h-[80px] bg-orange-50 rounded-full flex items-center justify-center"
          >
            <img
              src="public/icon/iconspace_Camera.svg"
              alt="Photography"
              class="w-10 h-10"
            />
          </div>
          <div>
            <h3 class="font-bold text-[#1a1a2c]">Photography</h3>
            <div class="flex items-center justify-between mt-1">
              <p class="text-gray-400 text-sm">95 Jobs Opened</p>
              <i class="fa-solid fa-arrow-right text-base text-gray-500"></i>
            </div>
          </div>
        </div>

        <div
          class="border border-gray-200 rounded-lg p-6 flex flex-col justify-between h-[268px]"

          <div
            class="w-[80px] h-[80px] bg-orange-50 rounded-full flex items-center justify-center"
          >
            <img
              src="public/icon/iconspace_Create_New.svg"
              alt="Copy Writing"
              class="w-10 h-10"
            />
          </div>
          <div>
            <h3 class="font-bold text-[#1a1a2c]">Copy Writing</h3>
            <div class="flex items-center justify-between mt-1">
              <p class="text-gray-400 text-sm">113 Jobs Opened</p>
              <i class="fa-solid fa-arrow-right text-base text-gray-500"></i>
            </div>

        </div>

        <div

          <div
            class="w-[80px] h-[80px] bg-orange-50 rounded-full flex items-center justify-center"

            <img
              src="public/icon/iconspace_Headset.svg"

            />

          <div>
            <h3 class="font-bold text-[#1a1a2c]">Music</h3>
            <div class="flex items-center justify-between mt-1">
              <p class="text-gray-400 text-sm">55 Jobs Opened</p>
              <i class="fa-solid fa-arrow-right text-base text-gray-500"></i>
            </div>
          </div>
        </div>

        <div
          class="border border-gray-200 rounded-lg p-6 flex flex-col justify-between h-[268px]"
        >
          <div
            class="w-[80px] h-[80px] bg-orange-50 rounded-full flex items-center justify-center"
          >
            <img
              src="public/icon/mdi_human-male-child.svg"
              alt="Human Resources"
              class="w-10 h-10"
            />
          </div>
          <div>
            <h3 class="font-bold text-[#1a1a2c]">Human Resources</h3>
            <div class="flex items-center justify-between mt-1">
              <p class="text-gray-400 text-sm">25 Jobs Opened</p>
              <i class="fa-solid fa-arrow-right text-base text-gray-500"></i>
            </div>
          </div>
        </div>

        <div
          class="rounded-lg h-[268px] bg-[#f47b3b] flex items-center justify-center"
        >
          <div class="flex items-center justify-between w-[226px] h-[102px]">
            <h3
              class="font-['Poppins'] font-medium text-[24px] leading-[34px] tracking-[0.2px] text-white"
            >
              Explore <br />
              30 More <br />
              Categories
            </h3>
            <i class="fa-solid fa-arrow-right text-white text-base"></i>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
